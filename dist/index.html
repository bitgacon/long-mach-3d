<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142b2b"><meta name="description" content="Long Mạch 3D: phiêu lưu, tu luyện, linh thú và bí mật Vọng Nguyệt."><title>Long Mạch 3D · Vọng Nguyệt</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231b3536'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-size='42' fill='%23e1be79'%3E龍%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="style.css?v=0.4"><link rel="stylesheet" href="progression.css?v=0.4"></head><body>
<div id="app"><canvas id="world" aria-label="Thế giới Long Mạch 3D. WASD di chuyển, phím 1 đến 4 dùng kỹ năng."></canvas><div id="labels" aria-hidden="true"></div><div class="vignette"></div><div id="boot"><div class="brand-seal">龍</div><h1>LONG MẠCH</h1><p>Đang đánh thức Vân Sơn…</p></div>

<nav class="hud menu-rail" aria-label="Menu nhân vật"><button data-panel="loadout" title="Trang bị [C]">⚔<span>Trang bị <kbd>C</kbd></span></button><button data-panel="forge" title="Lò rèn [I]">⚒<span>Lò rèn <kbd>I</kbd></span></button><button data-panel="inventory" title="Túi đồ [B]">▣<span>Túi đồ <kbd>B</kbd></span></button><button data-panel="pets" title="Pet [P]">狐<span>Pet <kbd>P</kbd></span></button><button data-panel="atlas" title="Thế giới [N]">⌖<span>Thế giới <kbd>N</kbd></span></button><button data-panel="codex" title="Bách khoa []">☷<span>Bách khoa <kbd></kbd></span></button><button data-panel="inner" title="Nội công [K]">氣<span>Nội công <kbd>K</kbd></span></button><button data-panel="skills" title="Kỹ năng [L]">✦<span>Kỹ năng <kbd>L</kbd></span></button></nav>
